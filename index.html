<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Receitas Pra Secar — Seu app de receitas</title>
  <meta name="description" content="Seu planejador de refeições saudáveis: receitas, planner semanal, lista de compras e diário alimentar." />
  <meta name="theme-color" content="#2E5B3E" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..800,50&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <div id="app-frame">
    <!-- ONBOARDING -->
    <div id="onboarding" class="onboarding hidden" aria-hidden="true"></div>

    <!-- APP SHELL -->
    <main id="view" class="view" tabindex="-1"></main>

    <!-- BOTTOM NAV -->
    <nav id="tabbar" class="tabbar" aria-label="Navegação principal">
      <button class="tab" data-route="home" aria-label="Início">
        <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-5.5h4V20"/></svg>
        <span>Início</span>
      </button>
      <button class="tab" data-route="receitas" aria-label="Receitas">
        <svg viewBox="0 0 24 24"><path d="M12 3c-4.5 0-7.5 2.6-7.5 6.2 0 2 1.1 3.4 2.5 4.3V21h10v-7.5c1.4-.9 2.5-2.3 2.5-4.3C19.5 5.6 16.5 3 12 3Z"/><path d="M9.5 21v-4M14.5 21v-4"/></svg>
        <span>Receitas</span>
      </button>
      <button class="tab" data-route="planner" aria-label="Planner">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="m9 15.5 2 2 4-4"/></svg>
        <span>Planner</span>
      </button>
      <button class="tab" data-route="lista" aria-label="Lista">
        <svg viewBox="0 0 24 24"><path d="M4 5h2.2l2 11.5h9.6l2-8.5H7"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="16.5" cy="20" r="1.4"/></svg>
        <span>Lista</span>
      </button>
      <button class="tab" data-route="bonus" aria-label="Bônus">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="9" width="17" height="12" rx="2"/><path d="M3.5 13h17M12 9v12"/><path d="M12 9C9 9 7 7.8 7 6a2.3 2.3 0 0 1 4.3-1.2L12 6.5l.7-1.7A2.3 2.3 0 0 1 17 6c0 1.8-2 3-5 3Z"/></svg>
        <span>Bônus</span>
      </button>
    </nav>

    <!-- MODAL / SHEET -->
    <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
    <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>

    <!-- TOAST -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="data/recipes.js?v=4"></script>
  <script src="data/bonus.js?v=4"></script>
  <script src="data/foods.js?v=4"></script>
  <script src="data/images.js?v=6"></script>
  <script src="app.js?v=4"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
    }
  </script>
</body>
</html>
